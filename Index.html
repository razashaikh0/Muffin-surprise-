<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samantha | Voice Artist Portfolio</title>
  <!-- Google Fonts & Canvas Fireworks -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0d0f18;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Animation Overlay */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 27, 75, 0.8), rgba(13, 15, 24, 0.95));
      z-index: 1;
      transition: all 1.5s ease-in-out;
    }

    /* Dream Palace Background (Hidden initially) */
    .dream-palace-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      opacity: 0;
      filter: blur(8px) brightness(0.6);
      transform: scale(1.1);
      transition: all 2s ease-in-out;
      z-index: 0;
    }

    /* Active Dream Palace Style */
    body.palace-active .dream-palace-bg {
      opacity: 1;
      filter: blur(2px) brightness(0.85);
      transform: scale(1);
    }

    body.palace-active .bg-overlay {
      background: radial-gradient(circle at center, rgba(255, 215, 0, 0.15), rgba(10, 10, 25, 0.6));
    }

    /* Main Container Card */
    .container {
      position: relative;
      z-index: 10;
      max-width: 800px;
      width: 90%;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.5s ease, border-color 0.5s ease;
    }

    body.palace-active .container {
      border-color: rgba(255, 215, 0, 0.4);
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
    }

    /* Typography */
    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff 30%, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.description {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Voice Waveform Graphic */
    .voice-waves {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 40px;
      margin-bottom: 30px;
    }

    .wave-bar {
      width: 4px;
      height: 100%;
      background: #fbbf24;
      border-radius: 2px;
      animation: quiet 1.5s ease-in-out infinite;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.6s; }
    .wave-bar:nth-child(5) { animation-delay: 0.8s; }

    @keyframes quiet {
      0%, 100% { height: 10px; }
      50% { height: 35px; }
    }

    /* Interactive Section */
    .question-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .question-box h3 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #f8fafc;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-yes {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }

    .btn-yes:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 30px rgba(245, 158, 11, 0.5);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Magic Message Revealed on YES */
    .magic-message {
      display: none;
      margin-top: 25px;
      font-size: 1.5rem;
      font-family: 'Playfair Display', serif;
      color: #ffe4e6;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Dream Palace Background Image -->
  <div class="dream-palace-bg"></div>
  <div class="bg-overlay"></div>

  <div class="container">
    <div class="subtitle">Voice Artist Portfolio</div>
    <h1>Samantha</h1>
    
    <!-- Animated Voice Waveform -->
    <div class="voice-waves">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <p class="description">
      Bringing stories to life with depth, emotion, and elegance. Welcome to Samantha's official voice world.
    </p>

    <div class="question-box">
      <h3 id="question-text">Would you like to step into Samantha's Dream Palace?</h3>
      
      <div class="btn-group" id="btn-group">
        <button class="btn btn-yes" onclick="triggerDreamPalace()">YES</button>
        <button class="btn btn-no" onclick="alert('Take your time!')">NO</button>
      </div>

      <div class="magic-message" id="magic-message">
        ✨ Welcome to Samantha's Dream Palace ✨
      </div>
    </div>
  </div>

  <script>
    function triggerDreamPalace() {
      // 1. Activate Dream Palace Background & Effects
      document.body.classList.add('palace-active');
      
      // 2. Hide buttons & Show Celebration Message
      document.getElementById('btn-group').style.display = 'none';
      document.getElementById('question-text').style.display = 'none';
      document.getElementById('magic-message').style.display = 'block';

      // 3. Launch Fireworks (Multiple bursts)
      var duration = 5 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        var particleCount = 50 * (timeLeft / duration);

        // Fireworks from left and right
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }
  </script>
</body>
</html>
